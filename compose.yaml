services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: goit
      MYSQL_PASSWORD: goitpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  importer:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./load_data.py:/app/load_data.py:ro
      - ./data:/data:ro
    command:
      - /bin/sh
      - -c
      - pip install --no-cache-dir mysql-connector-python && python load_data.py
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  airflow:
    build: .
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW_CONN_GOIT_MYSQL_DB: mysql://goit:goitpass@mysql:3306/olympic_dataset
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
    depends_on:
      importer:
        condition: service_completed_successfully

volumes:
  mysql_data:
